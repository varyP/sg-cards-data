  category_selection_period:
    value: calendar_quarter
    period: calendar_quarter
    note: A chosen category is locked for the whole calendar quarter (Jan-Mar, Apr-Jun, Jul-Sep, Oct-Dec per the T&C definition). A change made during a quarter applies from the next quarter.
    source_url: https://www.uob.com.sg/assets/pdfs/ladys-cards-tcs.pdf
    quote: You may change your selection each Quarter. The first selection made upon registering will be applicable for that Quarter. Subsequent selections will only be applicable to the following Quarter.
    source_type: issuer
    last_verified: 2026-10-07
  category_selection_deadline:
    value: 11:59pm SGT on the day before the quarter starts
    note: If several selections are made before a new quarter, the last one recorded by this deadline applies.
    source_url: https://www.uob.com.sg/assets/pdfs/ladys-cards-tcs.pdf
    quote: provided that such selection is made by 11.59PM (Singapore time) before the first calendar day of the following Quarter.
    source_type: issuer
    last_verified: 2026-10-07
  category_selection_default:
    value: previous_category_continues
    source_url: https://www.uob.com.sg/assets/pdfs/ladys-cards-tcs.pdf
    quote: If you do not select or change your Preferred Rewards Category(ies) for the next Quarter, the current selected category(s) shall continue to apply in the next Quarter.
    source_type: issuer
    last_verified: 2026-10-07
  travel_category_definition:
    value: airlines_and_hotels_only
    note: T&C Schedule 1 gives no MCC list for Travel. Travel agencies (MCC 4722) and car rental (MCC 7512) are not named, so they are not stated as covered. See notes for the product-page conflict.
    source_url: https://www.uob.com.sg/assets/pdfs/ladys-cards-tcs.pdf
    quote: Travel Credit card retail transaction(s) made at major airlines and/or hotels with their main business activity classified as flights and/or hotels only.
    source_type: issuer
    last_verified: 2026-10-07
  travel_category_product_page:
    value: airlines_hotels_resorts_duty_free
    note: Marketing page wording, broader than the T&C; the T&C prevails. The page's example merchant list includes online travel agencies and travel agents.
    source_url: https://www.uob.com.sg/personal/cards/rewards/ladys-card/index.page
    quote: Travel Travel comprises of airlines, hotels & resorts bookings and duty-free stores.
    source_type: issuer
    last_verified: 2026-10-07
  overseas_processed_sgd_fee_pct:
    value: 1
    unit: pct
    applies_to: SGD transactions on this Mastercard card processed outside Singapore (e.g. overseas-based websites)
    note: UOB general card information (applies across UOB Visa/Mastercard cards).
    source_url: https://www.uob.com.sg/web-resources/personal/pdf/personal/cards/common/cards/gen-info-cards.pdf
    quote: SGD transactions (including refunds, reversals and chargebacks) made using Visa or Mastercard and processed outside of Singapore will be subject to an international processing fee of 1% of transaction amount.
    source_type: issuer
    last_verified: 2026-10-07
