notes:
- 'Conflict (ground rule 9, T&C over marketing page): the Lady''s Cards T&C (Schedule 1, PDF dated Aug 2025) defines Travel as major airlines and hotels only and gives no MCC list for it; the product page says Travel covers airlines, hotels & resorts bookings and duty-free stores and lists example merchants including travel agencies (e.g. Chan Brothers Travel, EU Holidays), while saying UOB does not control how merchants are categorised. On the T&C, travel agencies (MCC 4722) and car rental (MCC 7512) are not stated as covered by Travel, and neither MCC is in the Transport list.'
