notes:
- 'DBS product pages are JS-rendered: fetch: headless.'
- DBS Points do not expire on this card ('Miles for Life').
- 'DBS overseas-processed SGD fee: two figures on DBS documents. 1% is in the DBS Credit Card Agreement clause 9.3 (PDF ''Last updated: 30 June 2026'') and in the ''DBS Credit Card Charges'' section of the Rates & Fees page. 2.8% is in the ''DBS Debit Card - Fees and Charges'' section of the same page, which is stamped ''As at 30 December 2020''. The newer credit-card document says 1%, so 1% is used for this credit card; the 2.8% is recorded separately as the debit-card figure.'
