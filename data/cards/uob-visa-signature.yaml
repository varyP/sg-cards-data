      last_verified: 2026-10-07
  earn:
  - category: overseas_foreign_currency
    description: Foreign-currency spend overseas or online. SGD transactions made overseas, and online spend at merchants with a Singapore payment gateway, earn the base UNI$1 per S$5.
    rate:
      value: 10
      unit: uni_dollars_per_sgd5
      note: Separate caps and minimum spends per category apply to cards approved on or after 1 July 2025, and to older cards from the September 2025 statement (T&C 'Updated 28 October 2025 (Ver 2.1)'). UNI$10 per S$5 = 4 miles per S$1 at UNI$1 = 2 miles.
      source_url: https://www.uob.com.sg/web-resources/personal/pdf/personal/cards/credit-cards/travel-cards/uob-visa-signature-card/terms-and-conditions-governing-uob-visa-signature-card.pdf
      quote: You will earn UNI$10 per S$5 spend overseas or online in foreign currencies
      source_type: issuer
      last_verified: 2026-10-07
    cap:
      value: 2400
      unit: uni_dollars_at_10x
      period: statement_month
      note: UNI$2,400 at 10X = S$1,200 of Overseas Spend per statement period.
      source_url: https://www.uob.com.sg/web-resources/personal/pdf/personal/cards/credit-cards/travel-cards/uob-visa-signature-card/terms-and-conditions-governing-uob-visa-signature-card.pdf
      quote: The awarding of UNI$10 per S$5 spend on Overseas Spend is subject to a cap of UNI$2,400, per statement period.
      source_type: issuer
      last_verified: 2026-10-07
    min_spend:
      value: 1000
      unit: sgd_per_statement_period
      period: statement_month
      source_url: https://www.uob.com.sg/web-resources/personal/pdf/personal/cards/credit-cards/travel-cards/uob-visa-signature-card/terms-and-conditions-governing-uob-visa-signature-card.pdf
      quote: To earn UNI$10 per S$5 spend on Overseas Spend, you are subject to a minimum spend of S$1,000 in Singapore dollars on Overseas Spend per statement period
      source_type: issuer
      last_verified: 2026-10-07
  - category: petrol_and_contactless
    rate:
      value: 10
      unit: uni_dollars_per_sgd5
      note: Separate caps and minimum spends per category apply to cards approved on or after 1 July 2025, and to older cards from the September 2025 statement (T&C 'Updated 28 October 2025 (Ver 2.1)'). UNI$10 per S$5 = 4 miles per S$1 at UNI$1 = 2 miles. Petrol excludes SPC and Shell; SimplyGo counts as contactless from 1 July 2025; Magnetic Secure Transmission payments are excluded.
      source_url: https://www.uob.com.sg/web-resources/personal/pdf/personal/cards/credit-cards/travel-cards/uob-visa-signature-card/terms-and-conditions-governing-uob-visa-signature-card.pdf
      quote: To earn UNI$10 per S$5 spend on Petrol Spend and/or Contactless Transactions, you are subject to a combined minimum spend of S$1,000 in Singapore dollars on Petrol Spend and/or Contactless Transactions per statement period
      source_type: issuer
      last_verified: 2026-10-07
    cap:
      value: 2400
      unit: uni_dollars_at_10x
      period: statement_month
      note: UNI$2,400 at 10X = S$1,200 of spend per statement period.
      source_url: https://www.uob.com.sg/web-resources/personal/pdf/personal/cards/credit-cards/travel-cards/uob-visa-signature-card/terms-and-conditions-governing-uob-visa-signature-card.pdf
      quote: The awarding of UNI$10 per S$5 spend on Petrol Spend and/or Contactless Transactions is subject to a cap of UNI$2,400, per statement period.
      source_type: issuer
      last_verified: 2026-10-07
    min_spend:
      value: 1000
      unit: sgd_per_statement_period
      period: statement_month
      source_url: https://www.uob.com.sg/web-resources/personal/pdf/personal/cards/credit-cards/travel-cards/uob-visa-signature-card/terms-and-conditions-governing-uob-visa-signature-card.pdf
      quote: To earn UNI$10 per S$5 spend on Petrol Spend and/or Contactless Transactions, you are subject to a combined minimum spend of S$1,000 in Singapore dollars on Petrol Spend and/or Contactless Transactions per statement period
      source_type: issuer
      last_verified: 2026-10-07
  - category: other
    rate:
      value: 1
      unit: uni_dollars_per_sgd5
      note: 0.4 miles per S$1 at UNI$1 = 2 miles.
      source_url: https://www.uob.com.sg/web-resources/personal/pdf/personal/cards/credit-cards/travel-cards/uob-visa-signature-card/terms-and-conditions-governing-uob-visa-signature-card.pdf
      quote: You will earn UNI$1 per S$5 spend on the Card. There is no cap to the amount of UNI$ earned on this basic tier.
      source_type: issuer
      last_verified: 2026-10-07
    cap:
      value: none
