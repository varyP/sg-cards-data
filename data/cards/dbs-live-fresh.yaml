  overseas_processed_sgd_fee_pct:
    value: 1
    unit: pct
    applies_to: SGD transactions on DBS Visa/Mastercard credit cards processed outside Singapore
    note: DBS Credit Card Agreement clause 9.3, last updated 30 June 2026 (newer than the 2.8% debit-section text). Same wording in the 'DBS Credit Card Charges' section of the Rates & Fees page.
    source_url: https://www.dbs.com.sg/iwov-resources/pdf/cards/dbs-agreement-2019.pdf
    quote: All card transactions processed outside Singapore but charged in Singapore dollar (i.e. without any currency conversion) (including refunds and reversals) will be subject to an administrative fee of 1% by Visa or MasterCard, which shall be payable by you and debited from your Card account.
    source_type: issuer
    last_verified: 2026-10-07
  overseas_processed_sgd_fee_pct_debit_card_section:
    value: 2.8
    unit: pct
    applies_to: DBS debit cards only (debit-card section of the Rates & Fees page), not this credit card
    note: 'Recorded only to document the conflict raised in issue #8. The section is stamped ''As at 30 December 2020''. Do not quote this figure for the credit card.'
    source_url: https://www.dbs.com.sg/i-bank/cards/cards-rates-fees.page
    quote: All transactions processed outside of Singapore but charged in Singapore Dollar (i.e. without any currency conversion) (including refunds and reversals) will be subject to an administrative fee of 2.8% on the total transaction amount, which includes a 1% fee by Visa/Mastercard or 0.6% fee by UnionPay
    source_type: issuer
    last_verified: 2026-10-07
