name: weekly-health
on:
  schedule:
    - cron: "0 4 * * 1"   # Monday 12:00 SGT (after weekly-reverify)
  workflow_dispatch:
permissions:
  contents: read
  issues: write          # '[health] attention needed' and 'pipeline broken' issues
  pull-requests: read    # review-backlog check (PRs waiting > 7 days)
  actions: read          # download the latest reverify artifact
concurrency:
  group: weekly-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}   # built-in token only; no secrets, no PATs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch latest reverify results (if any)
        run: |
          RID=$(gh run list --workflow weekly-reverify.yml --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$RID" ]; then gh run download "$RID" -n reverify-latest -D reports || true; fi
      - name: Health report (includes canary)
        run: python scripts/health_report.py
      - name: Report to job summary
        if: always()
        run: cat reports/health.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Report broken pipeline
        if: failure()
        run: python scripts/pipeline_broken.py weekly-health "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
