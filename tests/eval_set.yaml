    expected: "No. Two chosen categories, each capped at S$750 spend a month (1,350 UNI$), total S$1,500 (2,700 UNI$). The S$2,000 single cap applied until 31 Jul 2025."
    must_include: ["750", "2 categories|two categories", "1,500|1500"]
    must_not: ["2,000 per month is the current cap"]
    source_url: https://www.uob.com.sg/assets/pdfs/ladys-cards-tcs.pdf
