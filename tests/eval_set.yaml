# Evaluation set for the SG cards bot (phase 1 pilot data, verified 2026-10-03 SGT).
# Owner: Maxis (the second reviewer in REVIEW.md), maintained with grokbot. Changes to this file follow
# REVIEW.md: both reviewers must OK.
# Kill criterion (phase 1): the bot must score >= 95% on this set AND beat a general chatbot
# (same questions, no data repo) by a clear margin. Otherwise, stop and rethink.
#
# Grading per case:
#   must_include: every item must be present (numbers may be formatted differently, e.g. S$1,000 / $1000)
#   must_not:     any item present = fail
#   behaviour:    checked by the grader (citation with source + last-checked date, caveats, refusal, ...)
# Case IDs M1-M8 are the second reviewer's original eight. "as_of" = the date the answer is valid for.
meta:
  owner: Maxis
  maintained_with: grokbot
  data_as_of: 2026-10-03
  pass_threshold_pct: 95
  default_behaviour: [cites issuer source with last-checked date, no affiliate links, information-only disclaimer when recommending]
cases:
